[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drivemods-license-bot"
version = "0.2.0"
description = "Telegram license ordering with durable payment and delivery records"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.31,<4", "httpx>=0.28,<1", "python-dotenv>=1.2,<2", "qrcode[png]>=8.2,<9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "Pillow>=13,<14", "zxing-cpp>=3.1,<4"]
firmware = ["telethon>=1.45,<2"]

[project.scripts]
drivemods-bot = "drivemods_bot.__main__:main"
nextmode-sw = "firmware_bot.__main__:main"
drivemods-crypto-check = "crypto_checkout.__main__:main"

[tool.setuptools.packages.find]
include = ["drivemods_bot*", "firmware_bot*", "crypto_checkout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

